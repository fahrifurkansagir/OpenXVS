# OpenXVS v1.1.0 Pytest Configuration
#
# Scopes default bare `pytest` runs cleanly to all active OpenXVS v1.1.0
# formal assurance (`xvs-certgen`, TLA+/TLC, Kani bindings), clean-room export,
# release gates, live SIL, real-world sensor health, and core avionics
# verification suites.
#
# To run any optional Playwright or quarantined legacy test file directly, pass:
#   PYTHONPATH=src .\.venv\Scripts\python.exe -m pytest -o addopts="" <test_path>

[pytest]
testpaths = tests
pythonpath = src
norecursedirs =
    .git
    .venv
    build
    dist
    output
    outputs
    apps
    docker
    formal
    sim
    tools
    xvs-core
    xvs-active-range
    xvs-odd-vlm
    xvs-os-hal
    xvs-multiship-coord

addopts =
    # --- 1. Optional Playwright browser tests (6 files; require `playwright` package) ---
    --ignore=tests/xvs/test_limb.py
    --ignore=tests/xvs/test_render_traffic.py
    --ignore=tests/xvs/test_renderer.py
    --ignore=tests/xvs/test_traffic_g2_fixes.py
    --ignore=tests/xvs/test_traffic_models_and_ring.py
    --ignore=tests/xvs_v2/test_m1_livedeck_e2e.py
    # --- 2. Optional quarantined legacy test ignores ---
    --ignore=tests/test_cfar_and_aoa.py
    --ignore=tests/test_cpp_dsp_pipeline.py
    --ignore=tests/test_fmcw_simulation.py
    --ignore=tests/test_imm_ekf_tracking.py
    --ignore=tests/test_phase2_protocol_and_manifest.py
    --ignore=tests/test_system_integration.py
    --ignore-glob=tests/*_cms_*.py
    # --- 3. External dataset evaluation suites (require unbundled third-party corpora) ---
    --ignore=tests/test_icehorizon_eval.py
    --ignore=tests/xvs/test_integrity_h3_real_transfer.py
    # --- 4. Quarantined legacy superseded suites ---
    --ignore=tests/xvs/test_detection_g1_model.py
    --ignore=tests/xvs/test_detection_g1_splits.py
    --ignore=tests/xvs/test_display_g1.py
    --ignore=tests/xvs/test_g0_feasibility.py
    --ignore=tests/xvs/test_g1_system_harness.py
    --ignore=tests/xvs/test_report_provenance.py
    --ignore=tests/xvs/test_tracking_g1.py
    --ignore=tests/xvs_v2/test_livedeck_d2_hotswap.py
    --ignore=tests/xvs_v2/test_m1_assets_and_onnx.py
