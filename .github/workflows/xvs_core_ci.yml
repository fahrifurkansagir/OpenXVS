name: OpenXVS Full-Stack CI (5-Crate 26/26 Kani, Edge-Infer Rust, Studio & Pytest)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "xvs-core/**"
      - "xvs-active-range/**"
      - "xvs-odd-vlm/**"
      - "xvs-os-hal/**"
      - "xvs-multiship-coord/**"
      - "docker/edge-infer/**"
      - "apps/studio/**"
      - "assurance/**"
      - "configs/xvs/**"
      - "samples/**"
      - "audit/**"
      - "src/xvs/**"
      - "scripts/xvs/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements*.txt"
      - ".github/workflows/xvs_core_ci.yml"
  pull_request:
    paths:
      - "xvs-core/**"
      - "xvs-active-range/**"
      - "xvs-odd-vlm/**"
      - "xvs-os-hal/**"
      - "xvs-multiship-coord/**"
      - "docker/edge-infer/**"
      - "apps/studio/**"
      - "assurance/**"
      - "configs/xvs/**"
      - "samples/**"
      - "audit/**"
      - "src/xvs/**"
      - "scripts/xvs/**"
      - "tests/**"
      - "pytest.ini"
      - "requirements*.txt"
      - ".github/workflows/xvs_core_ci.yml"

permissions:
  contents: read

jobs:
  rust-core-and-kani:
    name: 5-Crate Bare-Metal Rust, 26/26 Kani Proofs, FFI/WASM & Full Pytest
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain & cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabi,wasm32-unknown-unknown

      - name: Install pinned Kani 0.68.0, cargo-deny & wasm-bindgen-cli
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
          cargo install --locked cargo-deny --version 0.22.0
          cargo install --locked wasm-bindgen-cli --version 0.2.130

      - name: Verify cargo-deny license & supply-chain policy
        run: cargo deny --manifest-path xvs-core/Cargo.toml check

      - name: Bare-metal no_std check across all 5 crates (ARM Cortex-M7F thumbv7em-none-eabi)
        run: |
          cargo check --manifest-path xvs-core/Cargo.toml --target thumbv7em-none-eabi -p xvs-rta-core -p xvs-math-core
          cargo check --manifest-path xvs-active-range/Cargo.toml --target thumbv7em-none-eabi --lib
          cargo check --manifest-path xvs-odd-vlm/Cargo.toml --target thumbv7em-none-eabi
          cargo check --manifest-path xvs-os-hal/Cargo.toml --target thumbv7em-none-eabi
          cargo check --manifest-path xvs-multiship-coord/Cargo.toml --target thumbv7em-none-eabi --lib

      - name: Clippy strict (-D warnings) across all 5 crates
        run: |
          cargo clippy --manifest-path xvs-core/Cargo.toml --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path xvs-active-range/Cargo.toml --all-targets -- -D warnings -A clippy::new_without_default -A clippy::manual_is_multiple_of
          cargo clippy --manifest-path xvs-odd-vlm/Cargo.toml --all-targets -- -D warnings -A clippy::assertions_on_constants
          cargo clippy --manifest-path xvs-os-hal/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path xvs-multiship-coord/Cargo.toml --all-targets -- -D warnings

      - name: Run unit & proptest suites across all 5 Rust crates
        run: |
          cargo test --manifest-path xvs-core/Cargo.toml --workspace --release
          cargo test --manifest-path xvs-active-range/Cargo.toml --release
          cargo test --manifest-path xvs-odd-vlm/Cargo.toml --release
          cargo test --manifest-path xvs-os-hal/Cargo.toml --release
          cargo test --manifest-path xvs-multiship-coord/Cargo.toml --release

      - name: Run all 26/26 Kani formal CBMC proof harnesses across all 5 Rust crates
        run: |
          cargo kani --manifest-path xvs-core/Cargo.toml -p xvs-rta-core
          cargo kani --manifest-path xvs-active-range/Cargo.toml
          cargo kani --manifest-path xvs-odd-vlm/Cargo.toml
          cargo kani --manifest-path xvs-os-hal/Cargo.toml
          cargo kani --manifest-path xvs-multiship-coord/Cargo.toml

      - name: Build xvs-ffi cdylib and xvs-wasm (<= 180 KB Brotli check)
        run: |
          cargo build --manifest-path xvs-core/Cargo.toml -p xvs-ffi --release
          cargo build --manifest-path xvs-core/Cargo.toml -p xvs-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir apps/livedeck/src/wasm xvs-core/target/wasm32-unknown-unknown/release/xvs_wasm.wasm

      - name: Set up Python 3.12+ & run certgen and full clean-room pytest suite
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy opencv-python-headless pillow pyyaml brotli matplotlib onnxruntime onnx pygltflib zstandard
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python scripts/xvs/xvs_certgen.py --check --cleanroom --out /tmp/xvs_certgen_ci_bundle.json
          PYTHONPATH=.:src python -m pytest -q

  edge-infer-rust:
    name: Pure-Rust Edge-Infer (Clippy, Locked Tests, Flight-Recorder Replay & TRT Script Syntax)
    runs-on: ubuntu-latest
    env:
      NON_FLIGHT_SIM_ONLY: "1"
      OPENXVS_NON_FLIGHT_SIM_ONLY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Audit docker/edge-infer Cargo.lock for 5D002 (zero TLS/AES) and lint with clippy (-D warnings)
        run: |
          ! grep -iE '^name = "(rustls|openssl|native-tls|aes|chacha|quinn|ring|aws-lc|hyper-tls|hyper-rustls|ureq)"' docker/edge-infer/Cargo.lock
          cargo clippy --manifest-path docker/edge-infer/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run locked unit tests for openxvs-edge-infer
        run: cargo test --manifest-path docker/edge-infer/Cargo.toml --locked

      - name: Build release openxvs-edge-infer and verify mission tape --replay (if present)
        run: |
          cargo build --manifest-path docker/edge-infer/Cargo.toml --release --locked --features non_flight_sim_only
          TAPE_PATH=""
          if [ -f samples/mission_flight_tape.ndjson ]; then
            TAPE_PATH="samples/mission_flight_tape.ndjson"
          elif [ -f audit/mission_flight_tape.ndjson ]; then
            TAPE_PATH="audit/mission_flight_tape.ndjson"
          fi
          if [ -n "${TAPE_PATH}" ]; then
            echo "[CI] Replaying hash-chained mission tape: ${TAPE_PATH}"
            docker/edge-infer/target/release/openxvs-edge-infer --replay "${TAPE_PATH}" | tee /tmp/edge_replay_ci.json
            grep -q '"valid": true' /tmp/edge_replay_ci.json
          else
            echo "[CI] No tracked mission_flight_tape.ndjson in samples/ or audit/; skipping live replay step"
          fi

      - name: Verify Jetson Orin Day-1 TensorRT builder script syntax (bash -n)
        run: |
          if [ -f docker/edge-infer/build_trt_engines.sh ]; then
            bash -n docker/edge-infer/build_trt_engines.sh
          fi

  studio-frontend:
    name: OpenXVS Studio TypeScript, Vitest & Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: TypeScript strict typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run Studio unit test suite (npm test)
        run: npm test

      - name: Build Studio production bundle (npm run build)
        run: npm run build
