[workspace]

[package]
name = "openxvs-observatory"
version = "3.0.0"
description = "OpenXVS v3.0 Observatory — Thin Optional Tauri v2 Native Desktop Wrapper"
authors = ["OpenXVS Contributors"]
license = "Apache-2.0 OR MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
