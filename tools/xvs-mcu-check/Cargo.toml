[workspace]

[package]
name = "xvs-mcu-check"
version = "5.2.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
description = "Bare-metal ARM Cortex-M7 (thumbv7em-none-eabi) #![no_std] #![forbid(unsafe_code)] Ring-0 compilation proof across all 5 OpenXVS Ring-0 crates"
publish = false

[lib]
name = "xvs_mcu_check"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "xvs-mcu-bench"
path = "src/bin/xvs_mcu_bench.rs"

[profile.release]
opt-level = "s"
codegen-units = 1
panic = "abort"

[dependencies]
xvs-rta-core = { path = "../../xvs-core/crates/xvs-rta-core", default-features = false }
xvs-math-core = { path = "../../xvs-core/crates/xvs-math-core", default-features = false }
xvs-active-range = { path = "../../xvs-active-range", default-features = false }
xvs-odd-vlm = { path = "../../xvs-odd-vlm", default-features = false }
xvs-os-hal = { path = "../../xvs-os-hal", default-features = false }
xvs-multiship-coord = { path = "../../xvs-multiship-coord", default-features = false }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
