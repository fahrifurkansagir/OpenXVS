[workspace]

[package]
name = "openxvs-edge-infer"
version = "5.0.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
description = "OpenXVS v5.0 headless Pure-Rust ort (load-dynamic) + xvs-active-range + xvs-rta-core + xvs-multiship-coord ARM64/x86_64 edge evaluation runner (NON_FLIGHT_SIM_ONLY)"
publish = false

[features]
default = ["non_flight_sim_only"]
non_flight_sim_only = []

[profile.release]
strip = true
debug = 0
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
xvs-active-range = { path = "../../xvs-active-range", features = ["std"] }
xvs-math-core = { path = "../../xvs-core/crates/xvs-math-core" }
xvs-rta-core = { path = "../../xvs-core/crates/xvs-rta-core" }
xvs-multiship-coord = { path = "../../xvs-multiship-coord" }
